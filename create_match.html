<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساخت مسابقه</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>ساخت مسابقه</h1>
        <p>برای شروع، نام خودت را وارد کن.</p>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input
                type="text"
                name="player_name"
                placeholder="نام بازیکن"
                maxlength="20"
                required
            >
            <button type="submit">ایجاد اتاق مسابقه</button>
        </form>
        <a class="back-link" href="/">بازگشت به صفحه اصلی</a>
    </div>
</body>
</html>
